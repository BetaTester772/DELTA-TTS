[project]
name = "delta-tts"
version = "1.0.0"
description = "DELTA-TTS: Adapting Autoregressive Model into Diffusion Language Model for Text-to-Speech"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
# Versions match the environment used for the paper. On macOS, PyTorch is newer: its MPS
# backend is faster there (Metal SDPA kernels) and gives the same speech tokens.
dependencies = [
    "torch==2.10.0; sys_platform != 'darwin'",
    "torch==2.15.0; sys_platform == 'darwin'",
    "torchaudio==2.10.0; sys_platform != 'darwin'",
    "torchaudio==2.11.1; sys_platform == 'darwin'",  # last torchaudio release; requires torch>=2.11
    "torchcodec==0.10.0; sys_platform != 'darwin'",
    "torchcodec==0.17.0; sys_platform == 'darwin'",
    "transformers==4.51.3",
    "peft==0.18.1",
    "huggingface-hub==0.36.2",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "librosa==0.11.0",
    "tqdm",
    # CosyVoice 3 (frontend, flow-matching decoder, vocoder)
    "hyperpyyaml==1.2.3",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    # onnxruntime-gpu has no macOS wheels; on macOS install the `mac` extra instead.
    "onnxruntime-gpu==1.24.4; sys_platform != 'darwin'",
    "openai-whisper==20250625",
    "wetext==0.1.2",
    "inflect==7.5.0",
    "conformer==0.3.2",
    "diffusers==0.37.0",
    "x-transformers==2.17.7",
    "einops==0.8.2",
    "lightning==2.6.1",
    "modelscope==1.35.1",
    "pyworld==0.3.5",
    "pyarrow==23.0.1",
    "matplotlib==3.10.8",
    "rich",
    "gdown",
    "wget",
    # pyworld imports pkg_resources (loaded through the CosyVoice config even at inference),
    # which setuptools 81 removes; torch 2.15 needs setuptools>=77.0.3.
    "setuptools<70; sys_platform != 'darwin'",
    "setuptools>=77.0.3,<81; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Apple Silicon (MPS): `uv sync --extra mac`. CosyVoice runs its ONNX models on the CPU build.
mac = [
    "onnxruntime==1.24.4; sys_platform == 'darwin'",
]
# Audio processing around DELTA-TTS (delta_tts/audio.py): Silero VAD and NVIDIA RE-USE speech enhancement.
# RE-USE runs on a pure-PyTorch Mamba port, so mamba-ssm is not needed.
audio = [
    "silero-vad==6.3",
    "safetensors",
]

[tool.uv]
package = false
